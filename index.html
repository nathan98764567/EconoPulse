<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ÉconoPulse</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div><div class="brand">Écono<span>Pulse</span></div><div class="sub">L’économie qui compte, expliquée.</div></div>
  <button id="watchBtn" class="icon">☆</button>
</header>

<main>
  <section class="hero">
    <div>
      <div class="eyebrow">MARDI 18 AOÛT</div>
      <h1>Ce qui bouge<br><span>aujourd’hui.</span></h1>
    </div>
    <button class="brief" onclick="showBrief()">Briefing ↗</button>
  </section>

  <div class="search"><span>⌕</span><input id="search" placeholder="Rechercher une entreprise, un secteur..."></div>

  <div class="chips" id="chips"></div>

  <section>
    <div class="section-head"><h2>À retenir</h2><span id="count"></span></div>
    <div id="feed"></div>
  </section>
</main>

<nav class="tabbar">
  <button class="tab active" data-page="home">⌂<small>Accueil</small></button>
  <button class="tab" data-page="sectors">◫<small>Secteurs</small></button>
  <button class="tab" data-page="watch">☆<small>Suivis</small></button>
  <button class="tab" data-page="settings">⚙<small>Réglages</small></button>
</nav>

<div id="modal" class="modal hidden"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<script src="app.js"></script>
</body>
</html>
